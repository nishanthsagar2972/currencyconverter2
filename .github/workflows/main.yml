
name: Build Currency Converter APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install project dependencies
        run: bun install

      - name: Build website
        run: bun run build

      
      - name: Find website output
        run: |
          echo "Checking build directories..."
          ls -la
          find . -maxdepth 5 -type f -name index.html \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './android/*'
          if [ -f dist/index.html ]; then
            echo "WEB_DIR=dist" >> "$GITHUB_ENV"
          elif [ -f build/index.html ]; then
            echo "WEB_DIR=build" >> "$GITHUB_ENV"
          elif [ -f out/index.html ]; then
            echo "WEB_DIR=out" >> "$GITHUB_ENV"
          else
            echo "ERROR: Built index.html was not found."
            exit 1
          fi

      - name: Install Capacitor
        run: bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor configuration
        run: |
          echo "Using web directory: $WEB_DIR"
          test -n "$WEB_DIR"
          test -f "$WEB_DIR/index.html"
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.currencyconverter.app",
            "appName": "Currency Converter",
            "webDir": "$WEB_DIR"
          }
          EOF

      - name: Add Android platform
        run: bunx cap add android

      - name: Sync Android project
        run: bunx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Currency-Converter-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
