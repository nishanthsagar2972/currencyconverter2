
name: Build Currency Converter APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install project dependencies
        run: bun install

      - name: Build website
        run: bun run build

      - name: Diagnose build output
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== package.json ==="
          cat package.json
          echo "=== Vite configuration ==="
          cat vite.config.ts
          echo "=== Built HTML files ==="
          find dist build out .output -maxdepth 5 -type f -name "index.html" 2>/dev/null || true
          echo "=== Dist files ==="
          find dist -maxdepth 3 -type f 2>/dev/null | head -100 || true
          echo "=== Output files ==="
          find .output -maxdepth 4 -type f 2>/dev/null | head -100 || true

      - name: Find website output
        run: |
          if [ -f dist/index.html ]; then
            echo "WEB_DIR=dist" >> "$GITHUB_ENV"
          elif [ -f build/index.html ]; then
            echo "WEB_DIR=build" >> "$GITHUB_ENV"
          elif [ -f out/index.html ]; then
            echo "WEB_DIR=out" >> "$GITHUB_ENV"
          else
            echo "ERROR: No static index.html was found."
            echo "This project may require static export configuration."
            exit 1
          fi

          echo "Website directory: $WEB_DIR"

      - name: Install Capacitor
        run: bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.currencyconverter.app",
            "appName": "Currency Converter",
            "webDir": "$WEB_DIR"
          }
          EOF

          cat capacitor.config.json

      - name: Add Android platform
        run: bunx cap add android

      - name: Sync Android project
        run: bunx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Currency-Converter-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

